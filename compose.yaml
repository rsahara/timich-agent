name: timich-agent

services:
  timich-agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: timich-agent:local
    container_name: timich-agent
    init: true
    restart: unless-stopped
    environment:
      TIMICH_AGENT_NAME: "${TIMICH_AGENT_NAME:-Timich Agent}"
      TIMICH_AGENT_DEVICE_LIMIT: "${TIMICH_AGENT_DEVICE_LIMIT:-32}"
      TIMICH_AGENT_APP_LINK_BASE_URL: "${TIMICH_AGENT_APP_LINK_BASE_URL:-https://link.timich.runo.jp}"
      TIMICH_AGENT_MEDIA_PUBLISHED_ADDR: "${TIMICH_AGENT_MEDIA_PUBLISHED_ADDR:-${TIMICH_AGENT_MEDIA_PORT:-8082}}"
      TIMICH_AGENT_TIMEZONE: "${TIMICH_AGENT_TIMEZONE:-}"
      TIMICH_AGENT_REMOTE_BROWSING_ENABLED: "${TIMICH_AGENT_REMOTE_BROWSING_ENABLED:-true}"
      TIMICH_AGENT_HEAVY_TASK_WORKERS: "${TIMICH_AGENT_HEAVY_TASK_WORKERS:-}"
      TIMICH_AGENT_UPDATE_MANIFEST_URL: "${TIMICH_AGENT_UPDATE_MANIFEST_URL:-}"
      TIMICH_AGENT_SEMANTIC_MODEL_MANIFEST_URL: "${TIMICH_AGENT_SEMANTIC_MODEL_MANIFEST_URL:-}"
      TIMICH_AGENT_SEMANTIC_RUNTIME_HELPER: "${TIMICH_AGENT_SEMANTIC_RUNTIME_HELPER:-}"
      TIMICH_AGENT_SEMANTIC_ONNX_DISABLED: "${TIMICH_AGENT_SEMANTIC_ONNX_DISABLED:-}"
      TIMICH_AGENT_SEMANTIC_ONNX_SERVER_PATH: "${TIMICH_AGENT_SEMANTIC_ONNX_SERVER_PATH:-}"
      TIMICH_AGENT_SEMANTIC_ONNX_PYTHON: "${TIMICH_AGENT_SEMANTIC_ONNX_PYTHON:-}"
      TIMICH_AGENT_SEMANTIC_ONNX_HOST: "${TIMICH_AGENT_SEMANTIC_ONNX_HOST:-}"
      TIMICH_AGENT_SEMANTIC_ONNX_PORT: "${TIMICH_AGENT_SEMANTIC_ONNX_PORT:-}"
      TIMICH_AGENT_SEMANTIC_ONNX_PROVIDER: "${TIMICH_AGENT_SEMANTIC_ONNX_PROVIDER:-}"
      TIMICH_AGENT_SEMANTIC_ONNX_TEXT_PROVIDER: "${TIMICH_AGENT_SEMANTIC_ONNX_TEXT_PROVIDER:-}"
      TIMICH_AGENT_SEMANTIC_ONNX_IMAGE_PROVIDER: "${TIMICH_AGENT_SEMANTIC_ONNX_IMAGE_PROVIDER:-}"
      TIMICH_AGENT_SEMANTIC_ONNX_TEXT_TEMPLATE: "${TIMICH_AGENT_SEMANTIC_ONNX_TEXT_TEMPLATE:-}"
      TIMICH_AGENT_MEDIA_HELPER_PATH: "${TIMICH_AGENT_MEDIA_HELPER_PATH:-}"
      TIMICH_AGENT_VIPS_PATH: "${TIMICH_AGENT_VIPS_PATH:-}"
      TIMICH_AGENT_FFMPEG_PATH: "${TIMICH_AGENT_FFMPEG_PATH:-}"
    ports:
      - "${TIMICH_AGENT_ADMIN_PORT:-8081}:8081"
      - "${TIMICH_AGENT_MEDIA_PORT:-8082}:8082"
    volumes:
      - ./.local:/var/lib/timich-agent
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8081/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
